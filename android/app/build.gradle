plugins { id 'com.android.application' }

android {
    namespace 'ke.infinitycyber.infigen'
    compileSdk 35

    defaultConfig {
        // Separate package ID allows side-by-side installation without replacing
        // the user's existing InfiGen app or sharing its private app data.
        applicationId 'ke.infinitycyber.infigen.test'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0-test'
    }
}
