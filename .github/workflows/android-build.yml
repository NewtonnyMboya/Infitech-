name: InfiGen side-by-side test APK build
on:
  workflow_dispatch:
  push:
    branches: [ infigen-side-by-side-test, infigen-payment-sandbox ]
    paths: [ "android/**", ".github/workflows/android-build.yml" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build isolated test APK
        working-directory: android
        run: gradle assembleDebug
      - name: Verify APK package identity and dashboard
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then yes | "$SDKMANAGER" --licenses >/dev/null || true; "$SDKMANAGER" "build-tools;35.0.0" >/dev/null; fi
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\\n' "$BADGING" | grep -F "package: name='ke.infinitycyber.infigen.test'"
          printf '%s\\n' "$BADGING" | grep -F "application-label:'InfiGen Test'"
          printf '%s\\n' "$BADGING" | grep -F "sdkVersion:'23'"
          unzip -p "$APK" assets/index.html | grep -F "bankingReadinessTools"
          unzip -p "$APK" assets/index.html | grep -F "client.functions.invoke('banking-readiness',{method:'GET'})"
          sha256sum "$APK"
          ls -lh "$APK"
      - name: Upload isolated test APK
        uses: actions/upload-artifact@v4
        with:
          name: infigen-side-by-side-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
